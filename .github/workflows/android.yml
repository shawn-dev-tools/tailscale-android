name: Android CI

on:
  push:
    branches:
      - main
      - "release-branch/*"
      - split-tunnel-picker
  pull_request:
    # all PRs on all branches
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    if: "!contains(github.event.head_commit.message, '[ci skip]')"

    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version-file: "go.mod"
      - name: Switch to Java 21
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: "temurin"
          java-version: "21"

      # Clean should essentially be a no-op, but make sure that it works.
      - name: Clean
        run: make clean

      - name: Format check (ktfmt)
        run: make fmt-check

      - name: Run Go tests
        run: make go-test

      # Sign debug builds with a fixed key so each new APK installs over the
      # previous one. Without the secret (e.g. fork PRs), Gradle generates a
      # throwaway key as usual.
      - name: Install fixed debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
          fi

      - name: Build APKs
        run: make tailscale-debug.apk

      # Publish to a release rather than an Actions artifact so the APK
      # doesn't count against the Actions storage quota.
      - name: Publish debug APK release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete debug-latest --yes --cleanup-tag || true
          gh release create debug-latest tailscale-debug.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Debug build (${GITHUB_REF_NAME} @ ${GITHUB_SHA::7})" \
            --notes "Debug APK built by Android CI run ${GITHUB_RUN_ID}."

      - name: Run tests
        run: make test

      - name: Run release lint
        run: make release-lint
